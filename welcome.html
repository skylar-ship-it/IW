<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Welcome — Implanted Wisdom</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap');
:root{
  --espresso:#120d0a;
  --espresso-2:#100c09;
  --espresso-3:#1d1610;
  --cream:#F2EEE7;
  --cream-70:rgba(242,238,231,.82);
  --gold:#C9A96E;
  --gold-deep:#a8874e;
  --display:'Cormorant Garamond',Georgia,serif;
  --body:'Jost',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);font-weight:300;background:var(--espresso);color:var(--cream);
  -webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit;text-decoration:none}

/* layered waves */
.wave{position:fixed;pointer-events:none;z-index:0}
.wave svg{display:block}

.stage{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:40px 26px;gap:0}

.logo{width:min(200px,44vw);margin-bottom:38px;
  opacity:0;transform:translateY(-26px) scale(.96);
  animation:drop .9s cubic-bezier(.22,.68,.24,1) .15s forwards}
.logo img{width:100%;height:auto;display:block}

.mask{overflow:hidden;display:block}
.mask>span{display:block;transform:translateY(-115%);animation:fall .85s cubic-bezier(.22,.68,.24,1) forwards}

.eyebrow{font-size:.78rem;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:20px}
.eyebrow .mask>span{animation-delay:.55s}

h1{font-family:var(--display);font-weight:400;font-size:clamp(3rem,9vw,5.6rem);line-height:1.02;letter-spacing:.005em;color:var(--cream)}
h1 .l1>span{animation-delay:.7s}
h1 .l2>span{animation-delay:.85s}

.copy{max-width:480px;margin:30px auto 0;font-size:1.04rem;line-height:1.85;color:var(--cream-70)}
.copy .mask>span{animation-delay:1.05s}

.cta{margin-top:42px;opacity:0;transform:translateY(18px);animation:rise .8s cubic-bezier(.22,.68,.24,1) 1.35s forwards}
.btn{display:inline-flex;align-items:center;gap:14px;background:var(--gold);color:var(--espresso);
  font-family:var(--body);font-weight:500;letter-spacing:.24em;text-transform:uppercase;font-size:.82rem;
  padding:19px 46px;border-radius:8px;transition:background .25s,transform .25s}
.btn:hover{background:#d9c099;transform:translateY(-1px)}
.btn .ar{transition:transform .25s}
.btn:hover .ar{transform:translateX(5px)}

.skip{position:fixed;top:24px;right:28px;z-index:3;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(242,238,231,.5);opacity:0;animation:rise .8s ease 1.9s forwards}
.skip:hover{color:var(--gold)}

@keyframes fall{to{transform:translateY(0)}}
@keyframes drop{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion: reduce){
  .logo,.cta,.skip{animation:none;opacity:1;transform:none}
  .mask>span{animation:none;transform:none}
}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IW">
<link rel="apple-touch-icon" href="iw-icon-180.png">
</head>
<body>

<div class="wave" style="left:-6vw;top:-12vh" aria-hidden="true">
  <svg width="46vw" height="124vh" viewBox="0 0 400 1000" preserveAspectRatio="none">
    <path d="M0,0 L240,0 C160,140 300,260 210,420 C130,560 250,700 150,840 C90,930 130,980 90,1000 L0,1000 Z" fill="#100c09"/>
    <path d="M0,0 L150,0 C90,160 190,300 120,460 C60,600 150,760 70,900 C40,950 50,980 30,1000 L0,1000 Z" fill="#1d1610"/>
  </svg>
</div>
<div class="wave" style="right:-6vw;bottom:-12vh" aria-hidden="true">
  <svg width="42vw" height="124vh" viewBox="0 0 400 1000" preserveAspectRatio="none" style="transform:scaleX(-1)">
    <path d="M0,0 L220,0 C150,160 280,300 200,460 C120,620 240,760 140,900 C100,960 120,990 80,1000 L0,1000 Z" fill="#100c09"/>
    <path d="M0,120 L120,80 C80,240 160,380 100,540 C50,680 130,820 60,950 L0,1000 Z" fill="#1d1610"/>
  </svg>
</div>


<main class="stage">
  <div class="logo"><img src="https://raw.githubusercontent.com/skylar-ship-it/IW/main/logo3D.png" alt="Implanted Wisdom"></div>

  <div class="eyebrow"><span class="mask"><span id="welcomeLine">Welcome to IW</span></span></div>

  <h1>
    <span class="mask l1"><span>Elevate your</span></span>
    <span class="mask l2"><span>practice.</span></span>
  </h1>

  <p class="copy"><span class="mask"><span>Implanted Wisdom partners with oral surgeons to build world-class full-arch implant practices. Proven systems. Peer network. Lasting growth.</span></span></p>

  <div class="cta">
    <a class="btn" href="onboarding.html" id="getStarted">Get Started <span class="ar">→</span></a>
  </div>
</main>

<script>
(function(){
  /* Get Started always continues to onboarding — the flow is login → welcome → onboarding */
  try{
    /* personalize the welcome line for returning partners */
    var p = JSON.parse(localStorage.getItem('iw_profile')||'null');
    if(p && p.name){
      var last = String(p.name).trim().split(/\s+/).pop();
      var w = document.getElementById('welcomeLine');
      if(w && last) w.textContent = 'Welcome back, Dr. ' + last;
    }
  }catch(e){}
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="iw-auth.js"></script>
<script>window.IW_MENU_THEME='cream';</script>
<script src="iw-menu.js"></script>
<script>if(window.iwAuth&&iwAuth.enabled()){iwAuth.requireSession("login.html");}</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
