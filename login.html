<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Partner Login — Implanted Wisdom</title>
<meta name="description" content="Partner login for Implanted Wisdom — a boutique consulting and growth partner for oral surgery and full-arch programs.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;0,600;1,300;1,500;1,600&family=Jost:wght@300;400;500;600&family=Courier+Prime:wght@400;700&display=swap');
:root{
  --ink:#14100d;--espresso:#17110d;--gold:#C9A96E;--gold-soft:#d9c099;--teal:#245C5C;
  --cream:#F7F2EC;--white:#fff;--ink-70:rgba(30,22,18,.92);--cream-70:rgba(247,242,236,.96);
  --hairline:rgba(201,169,110,.30);
  --display:'Cormorant Garamond',Georgia,serif;--body:'Jost',system-ui,sans-serif;--mono:'Courier Prime',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);font-weight:300;color:var(--cream);background:var(--espresso);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;position:relative;overflow:hidden}
body::after{content:"IW";position:absolute;right:-4%;bottom:-12%;font-family:var(--display);font-weight:600;
  font-size:42rem;color:rgba(201,169,110,.05);line-height:.7;pointer-events:none}
a{color:inherit;text-decoration:none}
.shell{position:relative;z-index:2;width:100%;max-width:430px}
.brandhead{text-align:center;margin-bottom:30px}
.brandhead img{height:64px;margin:0 auto 14px}
.brandhead .name{font-family:var(--display);font-size:1.7rem;color:var(--cream)}
.brandhead .sub{font-family:var(--body);font-weight:500;text-transform:uppercase;letter-spacing:.22em;
  font-size:0.64rem;color:var(--gold);margin-top:4px}
.card{background:rgba(247,242,236,.04);border:1px solid var(--hairline);border-radius:8px;padding:38px 34px;
  backdrop-filter:blur(6px)}
.tabs{display:flex;gap:6px;margin-bottom:26px;background:rgba(0,0,0,.18);padding:5px;border-radius:5px}
.tab{flex:1;text-align:center;padding:10px;border-radius:4px;font-family:var(--body);font-weight:500;
  font-size:0.85rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cream-70);cursor:pointer;transition:.2s}
.tab.active{background:var(--gold);color:var(--ink)}
.pane{display:none}.pane.active{display:block}
.field{margin-bottom:18px}
.field label{display:block;font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:0.76rem;
  color:var(--gold);margin-bottom:7px}
.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--hairline);border-radius:4px;
  background:rgba(0,0,0,.2);color:var(--cream);font-family:var(--body);font-size:.92rem}
.field input::placeholder{color:rgba(247,242,236,.78)}
.field input:focus,.field select:focus{outline:none;border-color:var(--gold)}
.btn{width:100%;padding:14px;border:0;border-radius:4px;background:var(--gold);color:var(--ink);
  font-family:var(--body);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:0.92rem;
  cursor:pointer;transition:.2s;margin-top:6px}
.btn:hover{background:var(--gold-soft)}
.row{display:flex;gap:12px}.row .field{flex:1}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:0.85rem;color:var(--cream-70)}
.meta a:hover{color:var(--gold)}
.demo{text-align:center;font-family:var(--mono);font-size:0.74rem;color:rgba(247,242,236,.76);margin-top:22px;letter-spacing:.03em}
.back{display:block;text-align:center;margin-top:22px;font-size:0.85rem;color:var(--cream-70);letter-spacing:.04em}
.back:hover{color:var(--gold)}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IW">
<link rel="apple-touch-icon" href="iw-icon-180.png">
</head>
<body>
  <div class="shell">
    <div class="brandhead">
      <img src="https://raw.githubusercontent.com/skylar-ship-it/IW/main/logo3D.png" alt="Implanted Wisdom">
      <div class="name">Implanted Wisdom</div>
      <div class="sub">Partner Portal</div>
    </div>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-pane="signin" onclick="pane(this)">Sign In</div>
        <div class="tab" data-pane="create" onclick="pane(this)">Request Access</div>
      </div>

      <!-- SIGN IN -->
      <form class="pane active" id="signin" onsubmit="signInSubmit(event)">
        <div class="field">
          <label>Email</label>
          <input type="email" id="si_email" placeholder="you@yourpractice.com" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="si_pw" placeholder="••••••••" required>
        </div>
        <div id="authMsg" style="display:none;font-size:.85rem;margin-bottom:12px;padding:9px 12px;border-radius:4px"></div>
        <button class="btn" type="submit">Sign In to Portal</button>
        <div class="meta">
          <label style="display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;color:var(--cream-70);font-size:0.85rem">
            <input type="checkbox" style="width:auto"> Remember me
          </label>
          <a href="#">Forgot password?</a>
        </div>
      </form>

      <!-- REQUEST ACCESS -->
      <form class="pane" id="create" onsubmit="requestSubmit(event)">
        <div class="field">
          <label>Practice / Group</label>
          <input type="text" id="rq_practice" placeholder="Oral Surgery Practice" required>
        </div>
        <div class="row">
          <div class="field"><label>Your Name</label><input type="text" id="rq_name" placeholder="Dr. Jane Smith" required></div>
          <div class="field"><label>Role</label>
            <select id="rq_role"><option>Surgeon / Owner</option><option>Surgeon</option><option>Treatment Coordinator</option><option>Practice Manager</option></select>
          </div>
        </div>
        <div class="field"><label>Work Email</label><input type="email" id="rq_email" placeholder="you@yourpractice.com" required></div>
        <div class="field"><label># of Surgeons</label>
          <select id="rq_surg"><option>1</option><option>2–3</option><option selected>4–6</option><option>7+</option></select>
        </div>
        <div id="rqMsg" style="display:none;font-size:.85rem;margin-bottom:12px;padding:9px 12px;border-radius:4px"></div>
        <button class="btn" type="submit">Request Access</button>
        <div class="demo" style="margin-top:14px">Access is granted after your introduction call.</div>
      </form>

      <!-- 2FA CODE -->
      <form class="pane" id="mfa" onsubmit="mfaSubmit(event)">
        <p style="color:var(--cream-70);font-size:.9rem;margin-bottom:14px">Two-factor is on for this account. Enter the 6-digit code from your authenticator app.</p>
        <div class="field">
          <label>Authentication code</label>
          <input type="text" id="mfa_code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456" maxlength="6" required>
        </div>
        <div id="mfaMsg" style="display:none;font-size:.85rem;margin-bottom:12px;padding:9px 12px;border-radius:4px"></div>
        <button class="btn" type="submit">Verify &amp; Continue</button>
      </form>

      <div class="demo">Secure partner access — provisioned by the IW team.</div>
    </div>

    <a class="back" href="index.html">← Back to implantedwisdom.com</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="iw-auth.js"></script>
<script>
function pane(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.pane).classList.add('active');
}
function msg(id,text,ok){
  var m=document.getElementById(id); if(!m) return;
  m.textContent=text; m.style.display='block';
  m.style.background = ok ? 'rgba(36,92,92,.18)' : 'rgba(140,47,47,.22)';
  m.style.color = ok ? '#bfe3df' : '#f2c9c2';
}
function proceed(){
  window.location.href = 'welcome.html';   /* branded welcome screen; it routes onward */
}
function show2fa(){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('active');});
  document.getElementById('mfa').classList.add('active');
  var i=document.getElementById('mfa_code'); if(i) i.focus();
}
var _mfa=null;
function signInSubmit(e){
  e.preventDefault();
  if(!window.iwAuth || !iwAuth.enabled()){ proceed(); return; }   /* preview fallback */
  var email=document.getElementById('si_email').value, pw=document.getElementById('si_pw').value;
  iwAuth.signIn(email,pw).then(function(res){
    if(res && res.error){ msg('authMsg', res.error.message||'Sign-in failed.', false); return; }
    iwAuth.aal().then(function(a){
      var need = a && a.data && a.data.nextLevel==='aal2' && a.data.currentLevel!=='aal2';
      if(!need){ proceed(); return; }
      iwAuth.listFactors().then(function(f){
        var totp = f.data && f.data.totp && f.data.totp[0];
        if(!totp){ proceed(); return; }
        iwAuth.challenge(totp.id).then(function(c){
          if(c.error){ msg('authMsg', c.error.message, false); return; }
          _mfa={ factorId: totp.id, challengeId: c.data.id };
          show2fa();
        });
      });
    }).catch(function(){ proceed(); });
  }).catch(function(){ msg('authMsg','Something went wrong. Try again.',false); });
}
function mfaSubmit(e){
  e.preventDefault();
  if(!_mfa){ proceed(); return; }
  var code=document.getElementById('mfa_code').value.replace(/\s/g,'');
  iwAuth.verify(_mfa.factorId,_mfa.challengeId,code).then(function(r){
    if(r.error){ msg('mfaMsg', r.error.message||'Invalid code — try again.', false); }
    else { proceed(); }
  }).catch(function(){ msg('mfaMsg','Verification failed. Try again.',false); });
}
function requestSubmit(e){
  e.preventDefault();
  var payload={
    practice:document.getElementById('rq_practice').value,
    name:document.getElementById('rq_name').value,
    email:document.getElementById('rq_email').value,
    role:document.getElementById('rq_role').value,
    surgeons:document.getElementById('rq_surg').value
  };
  if(!window.iwAuth || !iwAuth.enabled()){
    msg('rqMsg','Request received. The IW team will follow up after your introduction call.',true);
    e.target.reset(); return;
  }
  iwAuth.requestAccess(payload).then(function(res){
    if(res && res.error){ msg('rqMsg','Could not send request. Email skylar@pulveroralsurgery.com.',false); }
    else { msg('rqMsg','Request received. The IW team will follow up after your introduction call.',true); e.target.reset(); }
  }).catch(function(){ msg('rqMsg','Could not send request. Email skylar@pulveroralsurgery.com.',false); });
}
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){});}</script>
</body>
</html>
